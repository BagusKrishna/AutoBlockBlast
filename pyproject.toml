[build-system]
requires = ["setuptools>=80.9,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "autoblockblast"
version = "0.1.0"
description = "Android Block Blast vision and planning experiment"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.5.0", "numpy>=1.24.0", "adbutils>=1.0.8,<2.0.0", "setuptools>=80.9,<82", "av>=12"]

[project.scripts]
autoblockblast = "autoblockblast.autoplay:main"

[tool.setuptools.packages.find]
where = ["src"]
